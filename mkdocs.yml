site_name: rompy
site_description: Configure and run ocean models from Python and YAML
site_url: https://rom-py.github.io/rompy/
repo_url: https://github.com/rom-py/rompy
repo_name: rom-py/rompy
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first run: getting-started/first-run.md
  - Concepts:
      - Why rompy: concepts/why-rompy.md
      - Configuration and validation: concepts/configuration.md
      - Time: concepts/time.md
      - Grids: concepts/grids.md
      - Data and sources: concepts/data.md
      - The run lifecycle: concepts/run-lifecycle.md
      - Templates and rendering: concepts/templates.md
      - Backends, postprocessors and pipelines: concepts/backends.md
  - How-to:
      - The command line: how-to/cli.md
      - YAML configurations: how-to/yaml.md
      - Logging and formatting: how-to/logging.md
  - Plugins:
      - Plugin architecture: plugins/architecture.md
      - Writing a model plugin: plugins/model-plugin.md
      - Sources, backends and postprocessors: plugins/extending.md
      - Documenting a plugin: plugins/documenting.md
  - Models: models.md
  - Reference:
      - reference/index.md
      - Model run: reference/model.md
      - Model configuration: reference/config.md
      - Time: reference/time.md
      - Grids: reference/grid.md
      - Data: reference/data.md
      - Boundaries: reference/boundary.md
      - Sources: reference/source.md
      - Filters: reference/filters.md
      - Spectra: reference/spectrum.md
      - Base types: reference/types.md
      - Templates and rendering: reference/templates.md
      - YAML loading: reference/yaml.md
      - Run backends: reference/backends.md
      - Postprocessors: reference/postprocess.md
      - Pipelines: reference/pipeline.md
      - Transfers: reference/transfer.md
      - Logging and formatting: reference/logging.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Backend internals: development/backend-internals.md

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/rompy.css

extra:
  rompy:
    site: rompy

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
          options:
            docstring_style: auto
            docstring_section_style: table
            inherited_members: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            group_by_category: true
            summary: false
            filters: ["!^_", "!^model_(?!type$)"]
            extensions:
              - griffe_pydantic: {schema: false}
              - rompy_docs.griffe:PydanticFieldRules

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
