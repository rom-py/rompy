name: docs
on:
    push:
        branches:
            - main
    pull_request:
permissions:
    contents: write
jobs:
    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Configure Git Credentials
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
            - uses: actions/cache@v4
              with:
                  key: mkdocs-material-${{ env.cache_id }}
                  path: ~/.cache
                  restore-keys: |
                      mkdocs-material-
            - name: Install GDAL
              run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
            - run: pip install .[docs,test]
            # The examples read data from tests/data, downloaded from rompy-test-data
            - name: Download the example data
              run: python -c "import tests.conftest"
            # The notebooks are rendered on the rompy-notebooks site, not copied here.
            - name: Check the shared docs configuration
              run: rompy-docs check -f mkdocs.yml
            # Strict: broken links, missing API targets and failing examples fail the build
            - name: Build
              run: properdocs build --strict -f mkdocs.yml
            - name: Deploy
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: properdocs gh-deploy --force -f mkdocs.yml
